name: Rass checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Repository rules
        run: |
          set -euo pipefail
          bad=$(find . -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' -o -name '*.key' -o -name '*.sql' -o -name '*.zip' \) -not -path './.git/*' -print)
          test -z "$bad" || { echo "$bad"; exit 1; }
          ! grep -RIn --exclude-dir=.git --exclude='security.yml' --exclude='SECURITY.md' 'sb_secret_' .
          ! grep -RIn --exclude-dir=.git --exclude='security.yml' --exclude='SECURITY.md' 'BEGIN PRIVATE KEY' .
          ! grep -RIn --exclude-dir=.git --exclude='security.yml' --exclude='SECURITY.md' 'SUPABASE_SERVICE_ROLE_KEY' .
          ! grep -RIn --exclude-dir=.git --exclude='security.yml' --exclude='SECURITY.md' 'service_role' assets index.html admin.html
          ! grep -RIn --exclude-dir=.git --exclude='security.yml' '@latest' .
          test -f .nojekyll
          test -f CNAME
          test -f robots.txt
          test -f sitemap.xml
          test -f SECURITY.md
          test -f assets/js/security.js
          test -f assets/js/public-api.js
          test -f assets/js/runtime-v415.js
          test ! -f assets/js/admin-auth-v412.js
          ! grep -RIn --exclude-dir=.git --exclude='security.yml' 'admin-auth-v412' assets index.html admin.html
          grep -q 'Content-Security-Policy' index.html
          grep -q 'Content-Security-Policy' admin.html
          grep -q 'upgrade-insecure-requests' index.html
          grep -q 'upgrade-insecure-requests' admin.html
          grep -q 'RASS_HARDENING_VERSION' assets/js/security.js
          grep -q 'RASS_ADMIN_AUTH_VERSION' assets/js/security.js
          grep -q 'cleanup_unverified_totp' assets/js/security.js
          grep -q 'PENDING_KEY' assets/js/security.js
          grep -q 'mfa.challenge({factorId})' assets/js/security.js
          grep -q 'mfa.verify({factorId' assets/js/security.js
          ! grep -q 'challengeAndVerify' assets/js/security.js
          grep -q "RASS_RUNTIME_VERSION" assets/js/runtime-v415.js
          grep -q "America/Sao_Paulo" assets/js/runtime-v415.js
          grep -q 'runtime-v415.js?v=4.15' index.html
          grep -q 'runtime-v415.js?v=4.15' admin.html
          grep -q 'security.js?v=4.15' index.html
          grep -q 'security.js?v=4.15' admin.html
          ! grep -Eq '\?v=4\.(8|9|10|11|12|13|14)([^0-9]|$)' index.html admin.html
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find assets/js -type f -name '*.js' -print0)
      - name: HTML references and transport
        run: |
          python3 - <<'PY'
          import pathlib,re,sys,xml.etree.ElementTree as ET
          missing=[]; insecure=[]; duplicate_ids=[]; trailing=[]
          allowed_http=(
              'http://localhost',
              'http://127.0.0.1',
              'http://www.w3.org/2000/svg',
              'http://www.sitemaps.org/schemas/sitemap/0.9',
          )
          for f in pathlib.Path('.').rglob('*'):
              if not f.is_file() or '.git' in f.parts or f.name in {'security.yml','SECURITY.md'}: continue
              try: text=f.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              for m in re.finditer(r'http://[^\s"\'>]+',text):
                  if not m.group(0).startswith(allowed_http): insecure.append(f'{f}: {m.group(0)}')
          for html in map(pathlib.Path,['index.html','admin.html']):
              text=html.read_text(encoding='utf-8')
              for _,url in re.findall(r'\b(src|href)=["\']([^"\']+)',text,re.I):
                  if url.startswith(('#','http://','https://','mailto:','tel:','data:','blob:')): continue
                  clean=url.split('?',1)[0].split('#',1)[0]
                  if clean and not (html.parent/clean).exists(): missing.append(f'{html}: {clean}')
              ids=re.findall(r'\bid=["\']([^"\']+)',text,re.I)
              seen=set()
              for ident in ids:
                  if ident in seen: duplicate_ids.append(f'{html}: {ident}')
                  seen.add(ident)
              match=re.search(r'</html>(.*)\Z',text,re.I|re.S)
              if match and match.group(1).strip(): trailing.append(f'{html}: conteúdo após </html>')
          try: ET.parse('sitemap.xml')
          except Exception as e:
              print('Sitemap inválido:',e); sys.exit(1)
          if insecure: print('HTTP inseguro:\n'+'\n'.join(insecure))
          if missing: print('Arquivos ausentes:\n'+'\n'.join(missing))
          if duplicate_ids: print('IDs HTML duplicados:\n'+'\n'.join(duplicate_ids))
          if trailing: print('HTML com conteúdo residual:\n'+'\n'.join(trailing))
          if insecure or missing or duplicate_ids or trailing: sys.exit(1)
          PY
      - name: File size
        run: |
          set -euo pipefail
          bad=$(find . -type f -not -path './.git/*' -size +5M -print)
          test -z "$bad" || { echo "$bad"; exit 1; }
